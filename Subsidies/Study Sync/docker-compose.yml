version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required. Set it in .env or environment.}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:4000}
      - DB_PATH=/app/data/studysync.db
    volumes:
      - studysync-data:/app/data
    restart: unless-stopped

volumes:
  studysync-data:
