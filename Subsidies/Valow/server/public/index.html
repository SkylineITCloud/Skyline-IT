<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VALOW. — Admin Panel</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    color: #fff;
    font-family: 'Inter', sans-serif;
    padding: 40px;
    min-height: 100vh;
  }
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px);
    pointer-events: none;
    z-index: 999;
  }
  .grid-bg {
    position: fixed;
    inset: 0;
    background-image: linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
    background-size: 60px 60px;
    z-index: 0;
  }
  .container { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 40px;
    padding-bottom: 20px;
    border-bottom: 1px solid rgba(84,44,140,0.3);
    box-shadow: 0 1px 0 0 rgba(84,44,140,0.15);
  }
  h1 {
    font-family: 'Orbitron', monospace;
    font-size: 28px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: #aaa;
  }
  h1 span { color: #555; font-size: 12px; letter-spacing: 3px; display: block; margin-top: 4px; }
  .refresh-btn {
    font-family: 'Orbitron', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    background: none;
    border: 1px solid #333;
    color: #888;
    padding: 10px 24px;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 0 0 1px rgba(84,44,140,0.3);
  }
  .refresh-btn:hover { border-color: #666; color: #fff; box-shadow: 0 0 0 1px rgba(84,44,140,0.5), 0 0 20px rgba(84,44,140,0.1); }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    margin-bottom: 40px;
  }
  .stat-card {
    border: 1px solid #1a1a1a;
    padding: 24px;
    background: rgba(5,5,5,0.6);
    box-shadow: 0 0 0 1px rgba(84,44,140,0.2);
    text-align: center;
  }
  .stat-card .num {
    font-family: 'Orbitron', monospace;
    font-size: 42px;
    font-weight: 700;
    color: #fff;
  }
  .stat-card .label {
    font-family: 'Orbitron', monospace;
    font-size: 10px;
    letter-spacing: 3px;
    color: #555;
    margin-top: 6px;
    text-transform: uppercase;
  }

  .section-title {
    font-family: 'Orbitron', monospace;
    font-size: 16px;
    letter-spacing: 4px;
    color: #666;
    margin-bottom: 16px;
    text-transform: uppercase;
  }

  .product-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 40px;
  }
  .product-table th {
    font-family: 'Orbitron', monospace;
    font-size: 10px;
    letter-spacing: 3px;
    color: #555;
    text-transform: uppercase;
    text-align: left;
    padding: 12px 16px;
    border-bottom: 1px solid #1a1a1a;
  }
  .product-table td {
    padding: 14px 16px;
    border-bottom: 1px solid #111;
    font-size: 14px;
    color: #ccc;
  }
  .product-table td:first-child { font-family: 'Orbitron', monospace; letter-spacing: 2px; color: #aaa; }
  .product-table .bar-wrap {
    width: 100%;
    max-width: 300px;
    height: 6px;
    background: #111;
    border-radius: 3px;
    overflow: hidden;
  }
  .product-table .bar-fill {
    height: 100%;
    background: linear-gradient(90deg, rgba(84,44,140,0.4), rgba(84,44,140,0.7));
    border-radius: 3px;
    transition: width 0.5s ease;
  }
  .product-table .pct { color: #555; font-family: 'Orbitron', monospace; font-size: 12px; }

  .history-list {
    max-height: 400px;
    overflow-y: auto;
    border: 1px solid #1a1a1a;
    box-shadow: inset 0 0 0 1px rgba(84,44,140,0.1);
  }
  .history-item {
    display: flex;
    justify-content: space-between;
    padding: 10px 16px;
    border-bottom: 1px solid #0a0a0a;
    font-size: 13px;
    color: #777;
    font-family: 'Orbitron', monospace;
  }
  .history-item:last-child { border-bottom: none; }
  .history-item .prod { color: #aaa; letter-spacing: 2px; }
  .history-item .time { color: #444; font-size: 11px; }

  .status-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #222;
    margin-right: 8px;
    animation: blink 1.4s step-end infinite;
  }
  .status-dot.online { background: #4a4; box-shadow: 0 0 8px rgba(68,170,68,0.2); }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: #0a0a0a; }
  ::-webkit-scrollbar-thumb { background: #222; border-radius: 2px; }

  .back-link {
    font-family: 'Orbitron', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    color: #555;
    text-decoration: none;
    transition: color 0.3s;
    display: inline-block;
    margin-bottom: 20px;
  }
  .back-link:hover { color: #aaa; }

  @media (max-width: 768px) {
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
    body { padding: 20px; }
    h1 { font-size: 18px; }
  }
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="container">
  <header>
    <div>
      <h1>VALOW. ADMIN <span>VOTE MANAGEMENT PANEL</span></h1>
    </div>
    <div style="display:flex;align-items:center;gap:16px;">
      <span id="serverStatus" style="font-family:'Orbitron',monospace;font-size:10px;letter-spacing:2px;color:#444;display:flex;align-items:center;">
        <span class="status-dot" id="statusDot"></span> <span id="statusText">OFFLINE</span>
      </span>
      <button class="refresh-btn" onclick="fetchAll()">⟳ SYNC</button>
    </div>
  </header>

  <a href="/Subsidies/Valow/" class="back-link">← BACK TO MAIN SITE</a>

  <div class="stats-grid" id="statsGrid">
    <div class="stat-card"><div class="num" id="totalVotes">—</div><div class="label">Total Votes</div></div>
    <div class="stat-card"><div class="num" id="topProduct">—</div><div class="label">Top Product</div></div>
    <div class="stat-card"><div class="num" id="topPct">—</div><div class="label">Top Share</div></div>
    <div class="stat-card"><div class="num" id="uniqueVoters">—</div><div class="label">Products Voted</div></div>
  </div>

  <div class="section-title">⟡ PRODUCT RANKINGS</div>
  <table class="product-table" id="productTable">
    <thead>
      <tr><th>Product</th><th>Votes</th><th>Share</th><th>Bar</th></tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <div class="section-title">⟡ RECENT VOTES</div>
  <div class="history-list" id="historyList">
    <div style="padding:20px;text-align:center;color:#333;font-family:'Orbitron',monospace;font-size:11px;letter-spacing:2px;">Loading...</div>
  </div>
</div>

<script>
  const API = '/api/valow';

  async function fetchAll() {
    document.getElementById('statusText').textContent = 'SYNCING...';
    document.getElementById('statusDot').className = 'status-dot';

    await Promise.all([fetchStats(), fetchHistory()]);

    document.getElementById('statusText').textContent = 'ONLINE';
    document.getElementById('statusDot').className = 'status-dot online';
  }

  async function fetchStats() {
    try {
      const r = await fetch(API + '/admin/stats');
      const d = await r.json();
      if (!d.success) throw new Error('API error');

      document.getElementById('totalVotes').textContent = d.total;
      document.getElementById('topProduct').textContent = d.products.length > 0 ? d.products[0].name : '—';
      document.getElementById('topPct').textContent = d.products.length > 0 ? d.products[0].percentage + '%' : '—';
      document.getElementById('uniqueVoters').textContent = d.products.length;

      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';
      d.products.forEach(p => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${p.name}</td>
          <td style="font-family:'Orbitron',monospace;color:#fff;font-size:16px;">${p.count}</td>
          <td class="pct">${p.percentage}%</td>
          <td><div class="bar-wrap"><div class="bar-fill" style="width:${p.percentage}%"></div></div></td>
        `;
        tbody.appendChild(tr);
      });
    } catch (e) {
      document.getElementById('totalVotes').textContent = 'ERR';
      document.getElementById('statusText').textContent = 'ERROR';
    }
  }

  async function fetchHistory() {
    try {
      const r = await fetch(API + '/admin/history');
      const d = await r.json();
      if (!d.success) throw new Error('API error');

      const list = document.getElementById('historyList');
      if (d.history.length === 0) {
        list.innerHTML = '<div style="padding:20px;text-align:center;color:#333;font-family:\'Orbitron\',monospace;font-size:11px;letter-spacing:2px;">NO VOTES YET</div>';
        return;
      }
      list.innerHTML = d.history.slice().reverse().map(h => `
        <div class="history-item">
          <span class="prod">─-─ ${h.product}</span>
          <span class="time">${new Date(h.timestamp).toLocaleString()}</span>
        </div>
      `).join('');
    } catch (e) {
      document.getElementById('historyList').innerHTML = '<div style="padding:20px;text-align:center;color:#333;font-family:\'Orbitron\',monospace;font-size:11px;letter-spacing:2px;">FAILED TO LOAD</div>';
    }
  }

  fetchAll();
  setInterval(fetchAll, 10000);
</script>
</body>
</html>
